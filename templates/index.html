<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BRIEF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brief.css') }}">
  <script src="{{ url_for('static', filename='js/brief.js') }}" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Bias &amp; Research Intelligence Evaluation Framework</p>
      <h1>BRIEF</h1>
      <p>Review research assumptions before fieldwork begins.</p>
    </header>

    <section class="panel">
      <label for="mode">Research mode</label>
      <select id="mode"><option value="market">Market research</option><option value="ux">UX research</option></select>

      <label for="file">Upload PDF, DOCX, TXT or Markdown (optional)</label>
      <input id="file" type="file" accept=".pdf,.docx,.txt,.md">

      <label for="brief">Research brief</label>
      <textarea id="brief" rows="14" maxlength="24000" placeholder="Paste the research brief here"></textarea>

      <label class="inline"><input id="quick" type="checkbox" checked> Quick mode</label>
      <div class="actions">
        <button id="analyse" type="button">Run brief analysis</button>
      </div>
    </section>

    <section class="panel">
      <h2>Guide or questionnaire audit</h2>
      <label for="instrument">Instrument</label>
      <textarea id="instrument" rows="10" maxlength="40000" placeholder="Paste the discussion guide, questionnaire or test plan"></textarea>
      <button id="audit" type="button">Audit instrument</button>
    </section>

    <section id="status" class="panel" aria-live="polite" hidden></section>
    <section id="output" class="panel" hidden>
      <h2>Advisory research QA result</h2>
      <div id="assurance"></div>
      <label class="inline"><input id="reviewed" type="checkbox"> I have reviewed the limitations and will verify material findings before use.</label>
      <pre id="result"></pre>
    </section>
  </main>
</body>
</html>
