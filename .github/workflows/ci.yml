name: security-and-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m compileall -q .
      - run: node --check static/js/brief.js
      - run: pytest -q
      - run: pip-audit --requirement requirements.txt
      - run: docker build --tag brief:test .
      - name: Smoke-test the production container
        run: |
          docker run --detach --name brief-smoke --publish 8000:8000 \
            --env BRIEF_ENVIRONMENT=production \
            --env OPENAI_API_KEY=test-key \
            --env BRIEF_PASSWORD=test-password \
            --env BRIEF_POLICY_PROFILE=internal_confidential \
            brief:test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent --user researcher:test-password http://127.0.0.1:8000/ > /dev/null
          test "$(docker inspect --format='{{.State.Running}}' brief-smoke)" = "true"
      - if: always()
        run: docker rm --force brief-smoke || true
